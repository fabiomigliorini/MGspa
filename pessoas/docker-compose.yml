services:
  pessoas:
    build: ./
    container_name: pessoas
    restart: unless-stopped
    tty: true
    environment:
      TZ: America/Cuiaba
    volumes:
      - /opt/www:/opt/www
      - /tmp:/tmp/host
      - /media/publico:/media/publico
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8081:8081'
