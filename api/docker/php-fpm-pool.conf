; Dimensionamento do pool do PHP-FPM.
;
; A imagem oficial php:8.3-fpm-alpine vem com pm.max_children = 5 — teto de 5
; requisicoes PHP simultaneas para a API INTEIRA (negocios, notas, contas,
; pessoas, agro, estoque, MGprint, MGsis e os /oauth/* do Passport).
;
; Isso saturava em horario comercial: uma emissao de NFCe com a SEFAZ lenta
; segura um worker por minutos, e as demais requisicoes ficavam presas na
; listen.backlog — sem erro, so pendurando. Dava a impressao de sistema travado.
;
; Copiado como zzz-pool.conf para carregar DEPOIS de www.conf e zz-docker.conf
; (o php-fpm faz include de *.conf em ordem alfabetica; o ultimo vence).

[www]

pm = dynamic

; ~73MB de RSS por worker medido em producao; 100MB de margem para emissoes
; de NFCe com XML grande => 40 x 100MB = ~4GB (host tem 22GB disponiveis).
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16

; Recicla o worker periodicamente (defesa contra vazamento de memoria).
pm.max_requests = 500

; Sem isso o default e 0 = o FPM NUNCA mata um worker pendurado. Como
; max_execution_time no Linux nao conta tempo bloqueado em I/O de rede, uma
; chamada travada na SEFAZ ocuparia o worker indefinidamente.
; 300s da folga de sobra para o pior caso legitimo (envio + retries + consulta).
request_terminate_timeout = 300s

; Backtrace no log de qualquer requisicao acima de 15s — mostra ONDE travou.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 15s
