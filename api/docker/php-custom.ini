; Ajustes de PHP para producao.
; Copiado para /usr/local/etc/php/conf.d/99-custom.ini pelo Dockerfile.

memory_limit = 512M

; ---------------------------------------------------------------------------
; Upload
; ---------------------------------------------------------------------------
; Os defaults (2M / 8M) nao davam folga: os CSVs da tabela do IBPT tem 1,92 MB
; por UF e o upload quebraria na primeira versao em que eles incluissem NCMs.
upload_max_filesize = 16M
post_max_size = 20M

; ---------------------------------------------------------------------------
; OPcache
; ---------------------------------------------------------------------------
; O default da imagem oficial e max_accelerated_files = 10000, mas o projeto
; tem ~46 mil arquivos .php (app + vendor). Quando a hash table enche, o
; OPcache PARA de cachear e todo arquivo novo passa a ser recompilado a cada
; requisicao. 32531 e o proximo valor primo da tabela interna do PHP.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531

; O codigo entra no container por bind mount (/opt/www) e o deploy e um
; `git pull` — sem invalidacao por timestamp, o container serviria codigo
; velho ate o restart. Fica ligado; o custo e um stat() a cada 2s por arquivo.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; JIT desligado de proposito: workload web/IO-bound nao se beneficia (o tempo
; e gasto esperando banco e SEFAZ, nao em CPU) e adiciona risco.
opcache.jit = disable
opcache.jit_buffer_size = 0
