services:
    quasar-mgspa:
        build: ./
        restart: unless-stopped
        tty: true
        environment:
            TZ: America/Cuiaba
        volumes:
            - /opt/www:/opt/www
            - /tmp:/tmp/host
            - /media/publico:/media/publico                
        extra_hosts:
            - "host.docker.internal:host-gateway"              
        ports:
            - "8080:8080"
